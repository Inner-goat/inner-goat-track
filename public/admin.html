<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inner GOAT — Ziele bearbeiten</title>
<style>
body{font-family:Poppins,Arial,sans-serif;background:#0E0E0E;color:#fff;margin:0;padding:26px;max-width:760px;margin:0 auto}
a{color:#FF5F00}h1{font-size:22px}.sub{opacity:.6;font-size:14px;margin-top:-6px}
.row{display:flex;gap:10px;align-items:center;background:#171717;border:1px solid #262626;border-radius:12px;padding:12px;margin:8px 0}
.row .meta{width:230px}.row .id{display:block;opacity:.45;font-size:11px}
input{flex:1;padding:9px 11px;border-radius:8px;border:1px solid #333;background:#0e0e0e;color:#fff}
button{background:#FF5F00;border:0;color:#fff;font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer}
</style></head>
<body>
<h1>🐐 Ziele bearbeiten</h1>
<p class="sub">Ändere, wohin ein Sticker leitet — wirkt sofort, ohne Neudruck. · <a href="/dashboard">→ Dashboard</a></p>
<div id="list"></div>
<script>
function getKey(){let k=sessionStorage.getItem('ig_key'); if(!k){k=prompt('Passwort (ADMIN_PASSWORD):')||''; sessionStorage.setItem('ig_key',k);} return k;}
async function load(){
  const k=getKey();
  const res=await fetch('/api/admin?key='+encodeURIComponent(k));
  if(res.status===401){sessionStorage.removeItem('ig_key');alert('Falsches Passwort.');return load();}
  const {links}=await res.json();
  document.getElementById('list').innerHTML=links.map(l=>`
    <div class="row">
      <div class="meta"><b>${l.name}</b><span class="id">${l.id} · ${l.cta}</span></div>
      <input id="d-${l.id}" value="${(l.destination||'').replace(/"/g,'&quot;')}">
      <button onclick="save('${l.id}')">Speichern</button>
    </div>`).join('');
}
async function save(id){
  const k=getKey();
  const destination=document.getElementById('d-'+id).value;
  const res=await fetch('/api/admin?key='+encodeURIComponent(k),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,destination})});
  const btn=event.target; btn.textContent = res.ok?'Gespeichert ✓':'Fehler'; setTimeout(()=>btn.textContent='Speichern',1500);
}
load();
</script>
</body></html>
